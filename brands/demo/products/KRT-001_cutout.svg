<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 740" width="520" height="740">
  <defs>
    <linearGradient id="fabricGrad" x1="0%" y1="0%" x2="30%" y2="100%">
      <stop offset="0%" stop-color="#8B2436"/>
      <stop offset="50%" stop-color="#7A1F2B"/>
      <stop offset="100%" stop-color="#5C1820"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7A1F2B" stop-opacity="0"/>
      <stop offset="45%" stop-color="#9B3040" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7A1F2B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Body of kurta -->
  <path d="M 130 140 L 390 140 L 420 220 L 420 680 Q 420 710 390 710 L 130 710 Q 100 710 100 680 L 100 220 Z"
        fill="url(#fabricGrad)"/>

  <!-- Silk sheen overlay -->
  <path d="M 130 140 L 390 140 L 420 220 L 420 680 Q 420 710 390 710 L 130 710 Q 100 710 100 680 L 100 220 Z"
        fill="url(#sheen)"/>

  <!-- Left sleeve -->
  <path d="M 100 220 L 30 280 Q 10 310 20 360 L 70 380 L 100 340 Z"
        fill="url(#fabricGrad)"/>

  <!-- Right sleeve -->
  <path d="M 420 220 L 490 280 Q 510 310 500 360 L 450 380 L 420 340 Z"
        fill="url(#fabricGrad)"/>

  <!-- Collar — round neck with slight V -->
  <path d="M 200 140 Q 230 100 260 130 Q 290 100 320 140 Q 290 170 260 165 Q 230 170 200 140 Z"
        fill="#4D1219"/>

  <!-- Placket (centre button line) -->
  <line x1="260" y1="165" x2="260" y2="540" stroke="#C9A84C" stroke-width="2" opacity="0.5"/>

  <!-- Gold embroidery band at chest -->
  <ellipse cx="260" cy="270" rx="110" ry="18" fill="none" stroke="#C9A84C" stroke-width="2.5" opacity="0.75"/>
  <ellipse cx="260" cy="270" rx="104" ry="12" fill="none" stroke="#C9A84C" stroke-width="1" opacity="0.4"/>

  <!-- Chikankari motif cluster (simplified floral) -->
  <!-- Centre motif -->
  <circle cx="260" cy="270" r="8" fill="#C9A84C" opacity="0.55"/>
  <circle cx="260" cy="270" r="4" fill="#F5EDD6" opacity="0.6"/>
  <!-- Petal-like dashes around motif -->
  <line x1="260" y1="258" x2="260" y2="252" stroke="#C9A84C" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="260" y1="282" x2="260" y2="288" stroke="#C9A84C" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="248" y1="270" x2="242" y2="270" stroke="#C9A84C" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="272" y1="270" x2="278" y2="270" stroke="#C9A84C" stroke-width="2" opacity="0.5" stroke-linecap="round"/>

  <!-- Lower embroidery border band -->
  <rect x="100" y="600" width="320" height="4" rx="2" fill="#C9A84C" opacity="0.5"/>
  <rect x="100" y="610" width="320" height="2" rx="1" fill="#C9A84C" opacity="0.25"/>

  <!-- Hem -->
  <path d="M 100 700 Q 260 720 420 700 L 420 710 Q 420 730 390 730 L 130 730 Q 100 730 100 710 Z"
        fill="#5C1820"/>
</svg>
