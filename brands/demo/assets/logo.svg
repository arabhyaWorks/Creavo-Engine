<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 88" width="260" height="88">
  <!-- Circular crest -->
  <circle cx="44" cy="44" r="40" fill="#7A1F2B"/>
  <circle cx="44" cy="44" r="33" fill="none" stroke="#C9A84C" stroke-width="2"/>
  <!-- RP monogram -->
  <text x="44" y="52" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#F5EDD6"
        text-anchor="middle" font-weight="bold">RP</text>
  <!-- Brand name -->
  <text x="96" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#7A1F2B"
        font-weight="bold" letter-spacing="2">RANG</text>
  <text x="96" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#7A1F2B"
        font-weight="bold" letter-spacing="1">PARIDHAN</text>
  <!-- Gold rule -->
  <line x1="96" y1="67" x2="252" y2="67" stroke="#C9A84C" stroke-width="1.5"/>
  <!-- Est. label -->
  <text x="96" y="80" font-family="Georgia, serif" font-size="11" fill="#7A1F2B"
        letter-spacing="2" opacity="0.7">EST. LUCKNOW</text>
</svg>
